name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  ci:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: |
          choco install lua -y --no-progress
          echo "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH
      - name: Tests
        run: powershell -NoProfile -File tests\run.ps1
