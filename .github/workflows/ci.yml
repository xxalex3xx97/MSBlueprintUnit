name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          sudo ln -sf /usr/bin/luac5.4 /usr/local/bin/luac
      - name: Tests
        run: pwsh tests/run.ps1
